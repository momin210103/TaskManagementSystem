services:
  postgres:
    image: postgres:17-alpine
    container_name: taskmanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-TaskManagementDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgres@123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskmanagement-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-TaskManagementDb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanagement_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-TaskManagementDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Postgres@123}
      JwtSettings__Secret: ${JWT_SECRET:-DevelopmentSecretKeyForTaskManagementSystem2026Net10!}
      JwtSettings__Issuer: ${JWT_ISSUER:-TaskManagementAPI}
      JwtSettings__Audience: ${JWT_AUDIENCE:-TaskManagementClients}
      JwtSettings__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JwtSettings__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
      Cors__AllowedOrigins__2: http://localhost:80
      Cors__AllowedOrigins__3: http://localhost:8080
      Cors__AllowedOrigins__4: http://localhost
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskmanagement-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: taskmanagement_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskmanagement-network
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: taskmanagement_postgres_data

networks:
  taskmanagement-network:
    name: taskmanagement_network
    driver: bridge
